[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "question-service"
version = "0.1.0"
description = "Question management and AI question generation service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.27",
    "psycopg[binary]==3.19.1",
    "pydantic==2.8.2",
    "openai==1.30.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "ruff==0.3.5",
]
