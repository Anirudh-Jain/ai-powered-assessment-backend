version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-assessment-db
    environment:
      POSTGRES_USER: assessmentuser
      POSTGRES_PASSWORD: assessmentpass123
      POSTGRES_DB: assessment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessmentuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assessment-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-assessment-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://assessmentuser:assessmentpass123@postgres:5432/assessment_db
      JWT_SECRET: your-secret-key-change-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - assessment-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-assessment-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - assessment-network

volumes:
  postgres_data:

networks:
  assessment-network:
    driver: bridge
