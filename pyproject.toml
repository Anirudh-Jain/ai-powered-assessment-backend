[project]
name = "ai-powered-assessment-backend"
version = "0.1.0"
description = "Backend service for the AI Powered Assessment Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.27",
    "psycopg>=3.1.19",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.4.0",
    "passlib[bcrypt]>=1.7.4",
    "openai>=1.30.0",
    "python-dotenv>=1.2.2",
    "langchain>=1.4.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.3",
    "ruff>=0.3.5",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "src.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
