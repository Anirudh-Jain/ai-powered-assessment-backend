[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-powered-assessment-backend"
version = "0.1.0"
description = "Backend service for the AI Powered Assessment Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.27",
    "psycopg[binary]==3.19.1",
    "pydantic==2.8.2",
    "pydantic-settings==2.2.1",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "openai==1.30.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==0.23.3",
    "ruff==0.3.5",
]
